name: Arena Lua (alpha)
on:
  push:
    paths:
      - 'src/arena_game.lua'
      - 'src/arena_view.lua'
      - 'src/arena_original_art.lua'
      - 'src/arena_enemy_catalog.lua'
      - 'main.lua'
      - 'conf.lua'
      - 'tests/test_arena_game.lua'
      - 'tests/test_arena_original_art.lua'
      - 'tests/test_arena_enemy_catalog.lua'
      - 'tests/create_arena_visual_fixture.py'
      - 'tests/test_arena_game_runner.py'
      - '.github/workflows/arena-lua.yml'
  workflow_dispatch:
jobs:
  arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 love xvfb zip
      - name: Pure Lua gameplay tests and syntax
        run: python3 -m unittest discover -s tests -p 'test_arena_game_runner.py' -v
      - name: LÖVE2D graphical startup smoke test
        run: |
          set +e
          SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null timeout 8s xvfb-run -a love . >love-smoke.log 2>&1
          code=$?
          set -e
          cat love-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
          if grep -E '^Error:|stack traceback|Error loading game' love-smoke.log; then exit 1; fi
      - name: Render real map and actor pipeline in LÖVE
        run: |
          python3 tests/create_arena_visual_fixture.py
          (cd /tmp/bar-lua-visual-smoke && lua5.4 -e "assert(loadfile('main.lua')); assert(loadfile('cache/animations.lua')); assert(loadfile('cache/maps.lua')); assert(loadfile('cache/atlases.lua'))")
          set +e
          SDL_AUDIODRIVER=dummy ALSOFT_DRIVERS=null timeout 15s xvfb-run -a love /tmp/bar-lua-visual-smoke >visual-smoke.log 2>&1
          code=$?
          set -e
          cat visual-smoke.log
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          grep -F 'ARENA VISUAL SMOKE OK' visual-smoke.log
      - name: Package playable alpha (without proprietary APK assets)
        run: zip -q -r Bar-Lua-Alpha.love conf.lua main.lua src reports
      - uses: actions/upload-artifact@v4
        with:
          name: Bar-Lua-Alpha-Love
          path: Bar-Lua-Alpha.love
